<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ZUBR TRAIL — современные полуприцепы для ваших задач. Запись на тест-драйв.">
<meta name="theme-color" content="#0b0d11">
<title>Запись на тест-драйв | ZUBR TRAIL</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script>
(function(){
  try{
    // Mark the page before the stylesheet paints, even when opened directly.
    var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var saveData=navigator.connection&&navigator.connection.saveData;
    if(reduced||saveData)return;
    var viaNav=false;
    try{viaNav=sessionStorage.getItem("zubr-power-transition-path")===location.pathname}catch(e){}
    var doc=document.documentElement;
    doc.classList.add("power-entering");
    doc.dataset.powerEntry=viaNav?"navigation":"direct";
    // Safe fallback if a third-party script is blocked or loading fails.
    window.setTimeout(function(){
      doc.classList.remove("power-entering","power-arrived","power-leaving");
    },3800);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="assets/site-v3.css?v=1">
<link rel="stylesheet" href="assets/power-motion.css?v=3">
</head>
<body data-page="test-drive"><div class="power-page-wipe" aria-hidden="true"><div class="power-page-wipe__layer power-page-wipe__layer--red"></div><div class="power-page-wipe__layer power-page-wipe__layer--dark"></div><span class="power-page-wipe__brand">ZUBR <b>POWER</b></span></div><div id="app"><noscript>Для просмотра сайта ZUBR TRAIL включите JavaScript.</noscript></div><script src="assets/site-v3.js?v=1" defer></script>
<script src="assets/power-motion.js?v=3" defer></script></body>
</html>
