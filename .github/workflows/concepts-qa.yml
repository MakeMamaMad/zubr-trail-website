name: ZUBR GOLD immersive website end-to-end QA
on:
  push:
    branches: [main]
    paths:
      - "concepts/01-forge/**"
      - "concepts/shared/v2-data.js"
      - ".github/workflows/concepts-qa.yml"
      - "!concepts/previews/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS syntax and all nine pages
        shell: bash
        run: |
          set -euo pipefail
          for f in concepts/01-forge/gold-core.js concepts/01-forge/gold-pages.js concepts/01-forge/gold-motion.js concepts/shared/v2-data.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          root=Path('concepts/01-forge')
          pages=['index.html','catalog.html','model.html','technology.html','production.html','test-drive.html','news.html','article.html','contacts.html']
          for page in pages:
              f=root/page
              assert f.is_file(), f
              text=f.read_text()
              for required in ['gold-shell.css','gold-home.css','gold-interior.css','gold-core.js','gold-pages.js','gold-motion.js']:
                  assert required in text,(page,required)
          assets=Path('assets/colorways/gold')
          for name in ['hero','road','factory','aluminum','sat-150','sat-197','sat-500','sat-510','sat-545','sat-550']:
              img=assets/(name+'.webp')
              assert img.is_file() and img.stat().st_size>4000, img
          print('GOLD: 9 independent HTML routes, four JS modules, 10 images verified')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Browser QA desktop, mobile and interactions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/zubr-server.log 2>&1 &
          node > /tmp/gold-qa.log 2>&1 <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const root = 'http://127.0.0.1:8123/concepts/01-forge/';
            const pages = ['index.html','catalog.html','model.html?id=SAT-510',
              'technology.html','production.html','test-drive.html','news.html',
              'article.html?slug=aluminum','contacts.html'];
            const images = [];
            fs.mkdirSync('concepts/previews',{recursive:true});
            const page = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const jsErrors = [];
            page.on('pageerror', e=>jsErrors.push(e.message));
            async function openRoute(route){
              const response = await page.goto(root+route,{waitUntil:'networkidle'});
              if(!response || response.status()>=400)throw Error('Bad HTTP '+route);
              if(await page.locator('#app main').count()!==1)throw Error('No main in '+route);
              if(await page.locator('h1').count()!==1)throw Error('Wrong H1 in '+route);
              if(jsErrors.length)throw Error('JS '+route+' '+jsErrors.join('; '));
              const broken=await page.evaluate(()=>[...document.images].filter(img=>img.complete&&img.naturalWidth===0).map(img=>img.src));
              if(broken.length)throw Error('Broken image '+route+' '+broken.join(','));
            }
            for(const route of pages)await openRoute(route);
            console.log('PASS all nine site pages, no runtime errors');
            await openRoute('index.html');
            if(await page.locator('.rail-card').count()!==6)throw Error('Home: rail does not contain all six SAT models');
            if(await page.locator('.story-chapter').count()!==4)throw Error('Home: engineering story missing');
            if(await page.locator('[data-lab]').count()!==8)throw Error('Home: engineering hotspots missing');
            await page.locator('.lab-switch[data-lab="1"]').click();
            if(!(await page.locator('#labTitle').textContent()).includes('Варианты разгрузки'))throw Error('Home: lab hotspot does not update');
            const rail=page.locator('#modelRail');
            const before=await rail.evaluate(el=>el.scrollLeft);
            await page.locator('[data-rail-dir="1"]').click();
            await page.waitForTimeout(500);
            const after=await rail.evaluate(el=>el.scrollLeft);
            if(after<=before)throw Error('Horizontal product rail does not move');
            await page.locator('#menuTrigger').click();
            if(!(await page.locator('#siteMenu').isVisible()))throw Error('Overlay menu did not open');
            await page.keyboard.press('Escape');
            if(await page.locator('#siteMenu').isVisible())throw Error('Overlay menu Escape does not close');
            const initialTheme=await page.locator('html').getAttribute('data-theme');
            await page.locator('#themeButton').click();
            const switched=await page.locator('html').getAttribute('data-theme');
            if(initialTheme===switched)throw Error('Theme switch did not work');
            await page.locator('#themeButton').click();
            console.log('PASS cinematic rail, engineering hotspot, full-screen menu, theme switch');
            await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
            await page.waitForTimeout(250);
            await page.screenshot({path:'concepts/previews/gold-experience-desktop.png',fullPage:false});
            await page.screenshot({path:'concepts/previews/gold-experience-full.png',fullPage:true});
            await openRoute('catalog.html');
            if(await page.locator('[data-model]').count()!==6)throw Error('Atlas missing six models');
            await page.locator('[data-model="SAT-510"]').click();
            if(!(await page.locator('#atlasTitle').innerText()).includes('SAT-510'))throw Error('Atlas selection broken');
            if(!(await page.locator('#atlasLink').getAttribute('href')).includes('SAT-510'))throw Error('Atlas detail deep-link broken');
            await page.locator('[data-filter=grain]').click();
            if(await page.locator('[data-model]:visible').count()!==2)throw Error('Atlas grain filter broken');
            await page.locator('#compareAction').click();
            if(await page.locator('#compareResult table').count()!==1)throw Error('Atlas comparison failed');
            await page.screenshot({path:'concepts/previews/gold-experience-catalog.png',fullPage:false});
            console.log('PASS atlas, filters, model preview, comparison');
            for(const id of ['SAT-150','SAT-197','SAT-500','SAT-510','SAT-545','SAT-550']){
              await openRoute('model.html?id='+id);
              if((await page.locator('h1').innerText()).trim()!==id)throw Error('Model page wrong title '+id);
              if(await page.locator('a[href="test-drive.html?model='+id+'"]').count()===0)throw Error('Model CTA missing '+id);
              if(await page.locator('.spec-line').count()<3)throw Error('Model specs missing '+id);
            }
            console.log('PASS six individual model pages');
            await openRoute('technology.html');
            await page.locator('[data-tech="2"]').click();
            if(!(await page.locator('#techCurrentTitle').textContent()).includes('Конструктивная прочность'))throw Error('Technology switch broken');
            await openRoute('test-drive.html?model=SAT-510');
            if(await page.locator('select[name=model]').inputValue()!=='SAT-510')throw Error('Prefilled test-drive model broken');
            await page.locator('input[name=name]').fill('Тест');
            await page.locator('input[name=phone]').fill('+375291234567');
            await page.locator('input[name=consent]').check();
            await page.locator('#goldForm button[type=submit]').click();
            if(!(await page.locator('#formFeedback').innerText()).includes('Заявка сформирована'))throw Error('Request form state missing');
            for(const slug of ['grain','aluminum','floor'])await openRoute('article.html?slug='+slug);
            console.log('PASS technology interactions, test-drive form, all article routes');
            await page.setViewportSize({width:390,height:844});
            for(const route of pages){
              await openRoute(route);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              if(overflow>5)throw Error('Mobile horizontal overflow '+route+': '+overflow+'px');
            }
            await openRoute('index.html');
            await page.screenshot({path:'concepts/previews/gold-experience-mobile.png',fullPage:false});
            await page.locator('#menuTrigger').click();
            if(!(await page.locator('#siteMenu').isVisible()))throw Error('Mobile menu broken');
            await page.locator('#siteMenu a[href="catalog.html"]').click();
            await page.waitForURL('**/catalog.html');
            console.log('PASS mobile nine pages, full-screen menu and page transition');
            await page.close();
            await browser.close();
            console.log('ALL GOLD EXPERIENCE QA CHECKS PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Save diagnostics and screenshots to repository
        if: always()
        shell: bash
        run: |
          mkdir -p concepts/previews
          if [ -f /tmp/gold-qa.log ]; then cp /tmp/gold-qa.log concepts/previews/gold-experience-qa.txt; else echo "Browser QA did not start" > concepts/previews/gold-experience-qa.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concepts/previews/gold-experience-*
          if ! git diff --cached --quiet; then
            git commit -m "Capture ZUBR GOLD cinematic browser QA and desktop/mobile previews"
            git pull --rebase
            git push
          fi
