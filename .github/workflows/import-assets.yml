name: Import original ZUBR TRAIL imagery and deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: zubr-assets
  cancel-in-progress: false
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original generated visuals
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/6d566a15-5748-441a-bc21-943ff001ed39/6aba06ff-2971-4514-bc83-2c1e0e694ff8/Standalone_photorealistic_commercial_automotive_advertising_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGJmNmFiY2E3YjEyNTI1MyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc3MDA1OH0.w-nZg9e6joVoFthGuJJzGQAfY2MBkbcGzM4tF7l3Q40' --output "/tmp/hero.png"
test -s "/tmp/hero.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/90d06811-1d90-480c-86e2-838d2d3762f8/232058e4-609e-4dda-ba45-8cb031cbb4ca/Premium_photorealistic_studio_product_photograph_of_a_modern.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDMwYTc2NjQ0NGNmY2M0YyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc1NjY0NH0.8MYio1xlRBV5YSoAvfI-RwKbBn8rqjXSmuxvch-ekSQ' --output "/tmp/sat-150.png"
test -s "/tmp/sat-150.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/d49ea429-5e09-4ab8-a3db-ce82682e8130/46a17dc2-84bd-497b-8b04-2ce3e47db44b/Premium_photorealistic_studio_product_photograph_of_a_red_op.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmMyNDFlNTliYzU3MTQ3ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc0NTQ5N30.EseU6xzOqFRpgmj0Wgf73AQazhJmx13K8-KyaAMi8Xc' --output "/tmp/sat-197.png"
test -s "/tmp/sat-197.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/16dd0109-471d-42eb-bbc8-5605bd999b3b/7def5a7a-c81f-4bb3-a448-ef17fee8e3f7/Premium_photorealistic_macro_industrial_product_photography_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWJhOGI5MmFjNDRjOGFiMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzczODI4Mn0.XfDsRD0nHffxnUl8LgHGPabmcTXVbklehUWgaj_5gpU' --output "/tmp/aluminum.png"
