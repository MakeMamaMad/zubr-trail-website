test -s "/tmp/road.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/b1f27cd9-6009-469d-9a22-c4c1203b96fa/bcf490dc-5832-4d2d-9114-496afd2ee720/photorealistic_premium_standalone_studio_product_photograph_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGFjZjBlNWViZmQ5ZDM5OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc1MDIzOH0.ZYPTaCOBW3A6D1PrtK9lmrgbS1Y7_xdZxkA-qjU7UdI' --output "/tmp/sat-500.png"
test -s "/tmp/sat-500.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/500f54e8-714d-4f98-84a8-3fe22d8c6c1f/efb99ace-4567-4351-a159-78569aa8442d/photorealistic_premium_standalone_studio_product_photograph_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2NkMDBiYzYzYmRjMTRmNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc2OTI4Nn0.QEM6TRl3f7TMo4vbQs3brBwGpFJGceBmD_h1HpTW118' --output "/tmp/sat-510.png"
test -s "/tmp/sat-510.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/91ad61f2-5240-45e2-bdab-edc7872a5298/554f2825-3635-4db8-83ec-d506492df6f4/photorealistic_premium_standalone_studio_product_photograph_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDRiNWJmMDY3OGQ1YTQ3MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc2MzIwNn0.vqZDsOHuc6imjfeQ7dCdg7PK3oIFuFBekuNz1mQLLhI' --output "/tmp/sat-545.png"
test -s "/tmp/sat-545.png"
          curl --fail --location --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/8e521468-a0c6-4d63-aac3-41cfb5fa2e73/03abde2c-3535-49f9-9869-4b5adf200b40/photorealistic_premium_standalone_studio_product_photograph_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjFiM2IzMjM2MjA0OGFhZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzczODY1OX0.XfsRbNk17mub-RsLeTFbBOz_asDD_PndGZ_TC0GwbUw' --output "/tmp/sat-550.png"
test -s "/tmp/sat-550.png"
      - name: Optimize images to webp
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('/tmp').glob('*.png')):
              if p.stem not in ["hero","sat-150","sat-197","aluminum","factory","road","sat-500","sat-510","sat-545","sat-550"]:
                  continue
              image=Image.open(p).convert('RGB')
              image.thumbnail((1920,1280),Image.Resampling.LANCZOS)
              out=Path('assets')/(p.stem+'.webp')
              image.save(out, 'WEBP', quality=83, method=6)
              print(out, out.stat().st_size)
          PY
      - name: Permanently save generated images to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          git diff --cached --quiet || git commit -m "Add original ZUBR TRAIL image assets"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site with images
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy ZUBR TRAIL
        id: deployment
        uses: actions/deploy-pages@v4
