name: ZUBR new premium Grok driving reference clips
on:
  push:
    branches: [feature/zubr-industrial-film-20261111]
    paths: [.github/workflows/zubr-premium-3axle-new-driving.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch both authorized Grok 1.5 clips and extract verification frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p new_drives
          curl -fLsS --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 150 'https://vidgen.x.ai/xai-vidgen-bucket/xai-video-0bfdc021-49c7-92d4-907c-25ed9168aa01.mp4' -o new_drives/SAT500_red_3axle_truck.mp4
          curl -fLsS --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 150 'https://vidgen.x.ai/xai-vidgen-bucket/xai-video-ca0e6fde-cb64-9263-b2a1-080f9281c3e4.mp4' -o new_drives/SAT545_silver_3axle_truck.mp4
          for video in new_drives/*.mp4; do
            test "$(stat -c%s "$video")" -gt 100000
            ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate -of json "$video"
            stem="${video%.mp4}"
            for sec in 0 1 3 5 6; do
              ffmpeg -v error -y -ss "${sec}.3" -i "$video" -frames:v 1 -vf "scale=640:-2" "${stem}_at_${sec}.jpg"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ZUBR-NEW-PREMIUM-TRUCK-DRIVES
          path: new_drives/
          retention-days: 7
          if-no-files-found: error
