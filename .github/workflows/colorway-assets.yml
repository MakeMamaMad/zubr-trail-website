name: Generate gold and lime ZUBR TRAIL site photography
on:
  push:
    branches: [main]
    paths:
      - "concepts/build-colorways.py"
      - ".github/workflows/colorway-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install --quiet pillow numpy
      - name: Generate optimized concept images
        run: python concepts/build-colorways.py
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/colorways/gold assets/colorways/lime
          if ! git diff --cached --quiet; then
            git commit -m "Add gold and lime ZUBR TRAIL model photo colorways"
            git pull --rebase
            git push
          fi
