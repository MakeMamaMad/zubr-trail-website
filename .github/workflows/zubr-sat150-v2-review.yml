name: ZUBR SAT150 v2 controlled footage handoff
on:
  push:
    branches: [experiment/sat150-v2-storyboard-only-20261116]
    paths:
      - "experiments/sat150-v2/**"
      - ".github/workflows/zubr-sat150-v2-review.yml"
  pull_request:
    branches: [main]
    paths:
      - "experiments/sat150-v2/**"
      - ".github/workflows/zubr-sat150-v2-review.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install gTTS==2.5.4
      - name: Stage Grok shot and narration for manual QA, no posting
        run: python experiments/sat150-v2/fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: sat150-v2-raw-shot-and-voice
          path: sat150-v2-grok/
          retention-days: 7
