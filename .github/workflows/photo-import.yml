name: Import approved photo renders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rendered photos
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors -sS 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d99a9bcd-1c09-4eaa-ba41-b02cf69b2ca9.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmUwNDdmMTBkMWY5OGMzZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzY5MTUzNn0.brYWCvbkANm2Si4dvD3siHSrpM3bajSSVmr1kiMKpaU' -o '/tmp/hero.png'
          test -s '/tmp/hero.png'
          curl -fL --retry 4 --retry-all-errors -sS 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2efb59b9-aa36-470a-9590-0a466e270f52.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODFmMDE0NzliMDgxZWQyOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzcwMDM0NX0.IHVRApfqt7vWl69Nh7rOmjHT58ZOeO_kdI38z83P-54' -o '/tmp/sat-150.png'
          test -s '/tmp/sat-150.png'
          curl -fL --retry 4 --retry-all-errors -sS 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/ee32130d-2d65-49f6-b950-bf06e43268c9.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGI3NDYxOTNmZjJkODIwZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc3MzMzMX0.N79IA2TVXOT2PhnorSxoMJu6C2_Lxpc7Eqyyn5F1wIs' -o '/tmp/sat-197.png'
          test -s '/tmp/sat-197.png'
          curl -fL --retry 4 --retry-all-errors -sS 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f39778c9-cbed-4de1-b6c6-412ea6944871.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTIyMjlhZTQ0ODdjZGNkZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzcwNzM2NH0.UPppRKF3G84ogGnsajP45bwccsMxUndmh9NLUpHQuIc' -o '/tmp/sat-500.png'
          test -s '/tmp/sat-500.png'
          curl -fL --retry 4 --retry-all-errors -sS 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d7123a15-b675-40e4-adcb-a58dcc18538a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGZmOWU0YTA0OTc1YjAwZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzczNTQ1Nn0.lFhHt3evFdbdv75oS0TiUNhg3ZHW_CLp0oWTGrVSD6U' -o '/tmp/sat-545.png'
          test -s '/tmp/sat-545.png'
      - name: Convert and save photographic assets
        shell: bash
        run: |
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ["hero","sat-150","sat-197","sat-500","sat-545"]:
              im=Image.open('/tmp/'+name+'.png').convert('RGB')
              im.thumbnail((1920,1200),Image.Resampling.LANCZOS)
              target=Path('assets')/(name+'.webp')
              target.parent.mkdir(exist_ok=True)
              im.save(target,'WEBP',quality=88,method=6)
              print(name,target.stat().st_size)
          PY
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Replace ZUBR TRAIL renders with approved product images"
            git push
          fi
